<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BirkieBags | Handmade with love</title>
<style>
:root{--cream:#fbf7f1;--paper:#fffdfa;--pink:#e8c3c0;--rose:#b87578;--sage:#aab69f;--deep:#65745f;--ink:#463d39;--muted:#887d76;--line:#eadfd6;--shadow:0 12px 32px #59463a12}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.announcement{background:#f0dfda;text-align:center;padding:9px;font:11px Arial;letter-spacing:1.4px;color:#765c58}.wrap{max-width:1160px;margin:auto;padding:0 22px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.brand img{width:78px;height:78px;object-fit:cover;border-radius:15px}.brand b{font-size:28px;font-weight:normal;color:var(--rose)}.brand small{display:block;font:10px Arial;letter-spacing:2px;color:var(--muted);margin-top:4px}.nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.nav button,.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 14px;border-radius:24px;font:12px Arial;letter-spacing:.3px}.nav button.active,.btn.primary{background:var(--deep);border-color:var(--deep);color:white}.nav button:hover,.btn:hover{transform:translateY(-1px)}main{padding:30px 0 65px}.hero{background:linear-gradient(120deg,#f4e3df,#f8f1e8 60%,#e7ecdf);border-radius:25px;padding:48px;display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;box-shadow:var(--shadow)}.eyebrow{font:10px Arial;letter-spacing:2px;color:var(--deep);text-transform:uppercase}.hero h1{font-size:clamp(36px,5vw,57px);font-weight:normal;line-height:1.05;margin:14px 0}.hero p{line-height:1.7;color:#6f625b;max-width:480px}.hero-art{background:#fff9f2;border:1px dashed #d7aaa5;border-radius:50% 50% 46% 46%;padding:22px;text-align:center}.hero-art img{width:100%;max-width:270px;border-radius:18px;mix-blend-mode:multiply}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:38px 0 17px}.section-head h2{font-weight:normal;font-size:30px;margin:0}.muted{color:var(--muted);font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.bag-art{height:210px;display:grid;place-items:center;background:linear-gradient(145deg,#f4e4df,#f4efe6);font-size:85px}.bag-art.sage{background:linear-gradient(145deg,#e5eadf,#f7f2e9)}.bag-art.lilac{background:linear-gradient(145deg,#ece4ee,#f7f0e8)}.bag-art.gold{background:linear-gradient(145deg,#f1e8d5,#faf4e9)}.card-body{padding:17px}.card h3{font-weight:normal;margin:0 0 7px;font-size:21px}.price{color:var(--rose);font-size:18px}.card p{font:13px/1.5 Arial;color:var(--muted);min-height:39px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.small{font:11px Arial;padding:8px 12px}.page-title{font-size:36px;font-weight:normal;margin:4px 0 8px}.page-intro{color:var(--muted);line-height:1.6;margin:0 0 22px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.toolbar input,.field input,.field select,.field textarea,select{border:1px solid var(--line);background:white;border-radius:10px;padding:11px;color:var(--ink);width:100%}.toolbar input{max-width:260px}.field{display:grid;gap:6px;margin:12px 0;font:12px Arial;color:#665b55}.field textarea{min-height:90px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.panel{padding:22px}.notice{background:#f1eee5;border-radius:12px;padding:14px;color:#6c675b;font:12px/1.6 Arial;margin:16px 0}.tag{display:inline-block;background:#edf0e8;color:var(--deep);padding:5px 9px;border-radius:20px;font:10px Arial}.empty{padding:35px;text-align:center;color:var(--muted);background:#fffdfa;border:1px dashed var(--line);border-radius:15px}.hidden{display:none!important}.footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font:11px Arial;text-align:center}.drawer{position:fixed;right:0;top:0;height:100%;width:min(390px,92vw);background:var(--paper);box-shadow:-15px 0 40px #0002;z-index:5;padding:23px;overflow:auto}.shade{position:fixed;inset:0;background:#2d262333;z-index:4}.drawer-head{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:transparent;font-size:25px;color:var(--muted)}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f5eee8;border-radius:12px;padding:14px}.stat strong{font-size:23px;font-weight:normal;display:block}.adminbar{background:#e9eee4;border:1px solid #d5dfce;padding:12px 15px;border-radius:12px;margin-bottom:18px;font:12px Arial;display:flex;justify-content:space-between;gap:12px;align-items:center}.color-dots{display:flex;gap:7px;margin:8px 0}.dot{width:18px;height:18px;border-radius:50%;border:1px solid #ddd}.designer-preview{min-height:180px;border-radius:16px;background:#f4e5e0;display:grid;place-items:center;font-size:90px}.pill{border:1px solid var(--line);border-radius:18px;padding:7px 10px;background:#fff;font:11px Arial}.pill.selected{background:#e9eee4;border-color:var(--sage)}@media(max-width:760px){.header{align-items:flex-start;flex-direction:column}.nav{justify-content:flex-start}.hero{grid-template-columns:1fr;padding:28px}.hero-art{display:none}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.brand img{width:60px;height:60px}.brand b{font-size:24px}.section-head{align-items:start;flex-direction:column}}
</style></head>
<body>
<div class="announcement">HANDMADE WITH LOVE · EVERY STITCH TELLS A STORY</div>
<div class="wrap">
<header class="header"><div class="brand"><img src="logo.png" alt="BirkieBags yarn and crochet logo"><div><b>BirkieBags</b><small>HANDMADE CROCHET BAGS</small></div></div>
<nav class="nav" id="nav"><button data-page="home" class="active">Home</button><button data-page="sales">Sales</button><button data-page="products">All Products</button><button data-page="custom">Custom Bags</button><button data-page="account">Account</button><button id="favOpen">♡ Favorites</button><button id="loginOpen">Sign in</button><button id="adminNav" class="hidden" data-page="admin">Admin dashboard</button></nav></header>
<div id="adminBanner" class="adminbar hidden"><span>✿ Administrator preview is active — customer-only details are hidden from buyers.</span><button class="btn small" id="adminExit">Exit admin</button></div>
<main id="app"></main>
<footer class="footer">BirkieBags · Handmade with love, one stitch at a time. <br><span>Prototype storefront — sample products and demo interactions only.</span></footer>
</div>
<div id="overlay" class="hidden"><div class="shade" id="shade"></div><aside class="drawer"><div class="drawer-head"><h2 id="drawerTitle" style="font-weight:normal">Favorites</h2><button class="x" id="drawerClose">×</button></div><div id="drawerBody"></div></aside></div>
<script>
const demoBags=[
{id:1,name:"The Daisy Tote",price:38,stock:3,desc:"A cheerful everyday tote with a sweet handmade feel.",colors:["Blush","Cream","Sage"],emoji:"👜",tone:""},
{id:2,name:"Sunday Market Bag",price:32,stock:0,desc:"Roomy, lightweight, and ready for market mornings.",colors:["Sage","Oatmeal"],emoji:"🛍️",tone:"sage"},
{id:3,name:"Petal Mini",price:29,stock:2,desc:"A little bag for the little things you love.",colors:["Lilac","Blush"],emoji:"👛",tone:"lilac"},
{id:4,name:"The Cottage Crossbody",price:45,stock:1,desc:"A cozy crossbody with a soft, timeless silhouette.",colors:["Honey","Cream"],emoji:"👜",tone:"gold"},
{id:5,name:"Coastal Clutch",price:27,stock:0,desc:"A pretty evening clutch with a relaxed handmade look.",colors:["Cream","Blue"],emoji:"👝",tone:""}
];
let bags=JSON.parse(localStorage.getItem("bb_bags")||"null")||demoBags;
let favorites=JSON.parse(localStorage.getItem("bb_favs")||"[]");
let designs=JSON.parse(localStorage.getItem("bb_designs")||"[]");
let orders=JSON.parse(localStorage.getItem("bb_orders")||"[]");
let customRequests=JSON.parse(localStorage.getItem("bb_custom_requests")||"[]");
let orderInquiries=JSON.parse(localStorage.getItem("bb_order_inquiries")||"[]");
let customers=JSON.parse(localStorage.getItem("bb_customers")||"[]");
let registrationOpen=JSON.parse(localStorage.getItem("bb_registration")||"false");
let about=JSON.parse(localStorage.getItem("bb_about")||"null")||{title:"A note from the maker",body:"BirkieBags is a handmade crochet shop built around creativity, color, and the joy of carrying something made with care. Thank you for supporting handmade!",maker:"The BirkieBags maker"};
let user=JSON.parse(localStorage.getItem("bb_user")||"null");
let isAdmin=false,currentPage="home",selectedStyle="Daisy Tote",selectedColor="Blush",selectedHandle="Short handles",designerMode="style";
const app=document.getElementById("app");
const save=()=>{localStorage.setItem("bb_bags",JSON.stringify(bags));localStorage.setItem("bb_favs",JSON.stringify(favorites));localStorage.setItem("bb_designs",JSON.stringify(designs));localStorage.setItem("bb_orders",JSON.stringify(orders));localStorage.setItem("bb_user",JSON.stringify(user));localStorage.setItem("bb_custom_requests",JSON.stringify(customRequests));localStorage.setItem("bb_order_inquiries",JSON.stringify(orderInquiries));localStorage.setItem("bb_customers",JSON.stringify(customers));localStorage.setItem("bb_registration",JSON.stringify(registrationOpen));localStorage.setItem("bb_about",JSON.stringify(about))};
function go(p){currentPage=p;document.querySelectorAll(".nav [data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll(".nav [data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
function card(b){return `<article class="card"><div class="bag-art ${b.tone||""}">${b.image?`<img src="${b.image}" alt="${esc(b.name)}" style="width:100%;height:100%;object-fit:cover">`:(b.emoji||"👜")}</div><div class="card-body"><div class="tag">${b.stock>0?b.stock+" in stock":"Made-to-order style"}</div><h3>${esc(b.name)}</h3><div class="price">$${Number(b.price).toFixed(2)}</div><p>${esc(b.desc)}</p><div class="muted">Colors: ${b.colors.map(esc).join(" · ")}</div><div class="actions"><button class="btn small" onclick="toggleFav(${b.id})">${favorites.includes(b.id)?"♥ Saved":"♡ Favorite"}</button>${b.stock>0?`<button class="btn primary small" onclick="orderInquiry(${b.id})">Order inquiry</button>`:`<button class="btn small" onclick="go('custom')">Request custom</button>`}${isAdmin?`<button class="btn small" onclick="editBag(${b.id})">Edit</button>`:""}</div></div></article>`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
document.getElementById("adminBanner").classList.toggle("hidden",!isAdmin);
document.getElementById("adminNav").classList.toggle("hidden",!isAdmin);
if(currentPage==="home"){app.innerHTML=`<section class="hero"><div><div class="eyebrow">A little handmade happiness</div><h1>Bags with a little<br>extra <i>heart.</i></h1><p>Welcome to BirkieBags, where every bag is thoughtfully crocheted by hand. Find a favorite, or dream up something that's uniquely yours.</p><div class="actions"><button class="btn primary" onclick="go('sales')">Shop available bags</button><button class="btn" onclick="go('custom')">Design a custom bag</button></div></div><div class="hero-art"><img src="logo.png" alt="BirkieBags logo"></div></section><div class="section-head"><div><div class="eyebrow">Fresh from the hook</div><h2>Recently featured</h2></div><button class="btn" onclick="go('products')">View all products →</button></div><div class="grid">${bags.slice(0,3).map(card).join("")}</div><section class="panel" style="margin-top:28px;background:#f5eee8"><div class="eyebrow">About the maker</div><h2 style="font-weight:normal;margin:9px 0">${esc(about.title)}</h2><p class="muted">${esc(about.body)}</p><p class="muted" style="font-style:italic">${esc(about.maker)}</p></section>`;
}
if(currentPage==="sales"){let available=bags.filter(b=>b.stock>0);app.innerHTML=`<h1 class="page-title">Ready to find a new favorite?</h1><p class="page-intro">These bags are currently available and ready to be claimed.</p>${isAdmin?`<div class="toolbar"><button class="btn primary" onclick="editBag()">＋ Add a bag</button><span class="muted">Inventory controls are visible only in administrator mode.</span></div>`:""}<div class="grid">${available.length?available.map(card).join(""):'<div class="empty">No bags are in stock right now. Check back soon!</div>'}</div>`}
if(currentPage==="products"){app.innerHTML=`<h1 class="page-title">The BirkieBags collection</h1><p class="page-intro">Explore every style, including designs that are currently sold out.</p>${isAdmin?`<div class="toolbar"><button class="btn primary" onclick="editBag()">＋ Add a product</button></div>`:""}<div class="toolbar"><input id="search" placeholder="Search bag styles…" oninput="filterProducts(this.value)"></div><div class="grid" id="productGrid">${bags.map(card).join("")}</div>`}
if(currentPage==="custom"){app.innerHTML=`<h1 class="page-title">Dream up your own bag</h1><p class="page-intro">Choose a familiar BirkieBags shape or start with a blank canvas.</p><div class="notice">All custom bags are individually handmade. Because each order is made with care and attention to detail, production and shipping may take longer than standard orders. We'll confirm pricing and timing before accepting a custom order.</div><div class="two"><section class="panel"><div class="eyebrow">Your design studio</div><div class="toolbar"><button class="pill selected" id="modeStyle" onclick="setMode('style')">Existing style</button><button class="pill" id="modeBlank" onclick="setMode('blank')">Start from scratch</button></div><div class="field"><label>Bag style</label><select id="stylePick" onchange="selectedStyle=this.value">${["Daisy Tote","Market Bag","Mini Shoulder Bag","Crossbody","Clutch","Build-your-own shape"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Main color</label><select id="colorPick" onchange="selectedColor=this.value;updatePreview()">${["Blush","Cream","Sage","Lilac","Honey","Ocean blue","Custom color (describe below)"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Handle style</label><select id="handlePick" onchange="selectedHandle=this.value"><option>Short handles</option><option>Long shoulder strap</option><option>Crossbody strap</option><option>Drawstring</option></select></div><div class="field"><label>Extra details or color notes</label><textarea id="designNotes" placeholder="Tell us about stripes, flowers, pockets, lining, size, or anything else…"></textarea></div><div class="designer-preview" id="preview">👜</div><div class="actions"><button class="btn primary" onclick="saveDesign()">Save my design</button><button class="btn" onclick="submitCustomRequest()">Submit for a quote</button><button class="btn" onclick="postDesign()">Save & share publicly</button></div></section><section><div class="panel"><div class="eyebrow">Your saved designs</div><h2 style="font-weight:normal">My design book</h2><div id="myDesigns">${designList(designs.filter(d=>d.owner===(user?.email||"Guest")))}</div></div><div class="panel" style="margin-top:16px"><div class="eyebrow">Community inspiration</div><h2 style="font-weight:normal">Made by the community</h2><div id="community">${designList(designs.filter(d=>d.public))}</div></div></section></div>`}
if(currentPage==="admin" && isAdmin){
const pending=customRequests.filter(r=>r.status==="Pending").length;
app.innerHTML=`<div class="eyebrow">Private shop controls · Primary Administrator</div><h1 class="page-title">Administrator dashboard</h1><p class="page-intro">Your behind-the-scenes workspace for running BirkieBags. You are the Primary Administrator and control shop access, content, products, and future administrator permissions.</p>
<div class="statrow"><div class="stat"><strong>${bags.length}</strong><span class="muted">Product styles</span></div><div class="stat"><strong>${orders.length}</strong><span class="muted">Demo orders</span></div><div class="stat"><strong>${pending}</strong><span class="muted">Custom requests waiting</span></div></div>
<div class="two" style="margin-top:18px">
<section class="panel"><div class="eyebrow">Store access</div><h2 style="font-weight:normal">Customer registration</h2><p class="muted">Keep sign-ups closed while you prepare the shop. Open registration when you're ready for customers.</p><span class="tag">${registrationOpen?"Registration is OPEN":"Registration is CLOSED"}</span><div class="actions"><button class="btn primary" onclick="toggleRegistration()">${registrationOpen?"Close registration":"Open registration"}</button></div></section>
<section class="panel"><div class="eyebrow">Quick actions</div><h2 style="font-weight:normal">Manage your shop</h2><div class="actions"><button class="btn" onclick="editBag()">＋ Add product</button><button class="btn" onclick="adminSection('requests')">Review custom requests</button><button class="btn" onclick="adminSection('inquiries')">Product inquiries (${orderInquiries.length})</button><button class="btn" onclick="adminSection('products')">Manage inventory</button></div></section></div>
<div class="section-head"><div><div class="eyebrow">Your workspace</div><h2>Management center</h2></div></div>
<div class="grid">
<article class="panel"><h2 style="font-weight:normal">Products & inventory</h2><p class="muted">Edit photos, descriptions, colors, prices, and stock quantities.</p><button class="btn" onclick="adminSection('products')">Manage products</button></article>
<article class="panel"><h2 style="font-weight:normal">Custom bag requests</h2><p class="muted">Review designs, approve requests, and set a price before customers pay.</p><button class="btn" onclick="adminSection('requests')">Review requests (${pending})</button></article>
<article class="panel"><h2 style="font-weight:normal">Community gallery</h2><p class="muted">Review public designs and remove anything you don't want displayed.</p><button class="btn" onclick="adminSection('gallery')">Moderate gallery</button></article>
<article class="panel"><h2 style="font-weight:normal">Orders</h2><p class="muted">See demo orders and their current status.</p><button class="btn" onclick="adminSection('orders')">View orders</button></article>
<article class="panel"><h2 style="font-weight:normal">Customer list</h2><p class="muted">Prototype-only customer accounts created in this browser.</p><button class="btn" onclick="adminSection('customers')">View customers</button></article>
<article class="panel"><h2 style="font-weight:normal">About me section</h2><p class="muted">Edit the maker introduction customers see on your home page.</p><button class="btn" onclick="adminSection('about')">Edit about me</button></article>
<article class="panel"><h2 style="font-weight:normal">Storefront preview</h2><p class="muted">Switch back to the public-facing shop to see what customers see.</p><button class="btn" onclick="isAdmin=false;go('home')">View as customer</button></article>
</div>`;
}
if(currentPage==="admin" && isAdmin && window.adminSubpage){renderAdminSubpage()}
if(currentPage==="account"){app.innerHTML=user?`<h1 class="page-title">Hello, ${esc(user.first||"there")}!</h1><p class="page-intro">Your BirkieBags account and order history.</p><div class="two"><section class="panel"><div class="eyebrow">Personal details</div><h2 style="font-weight:normal">My information</h2><p class="muted"><b>Name</b><br>${esc(user.first)} ${esc(user.last)}</p><p class="muted"><b>Email</b><br>${esc(user.email)}</p><p class="muted"><b>Mailing address</b><br>${esc(user.address||"Not added in this demo")}</p><button class="btn" onclick="editProfile()">Edit details</button><div class="notice">Payment details are handled by the payment provider at checkout. This prototype does not collect or store card numbers.</div></section><section class="panel"><div class="eyebrow">Your purchases</div><h2 style="font-weight:normal">Order history</h2>${orders.length?orders.map(o=>`<p class="muted">${esc(o.name)} · $${o.price.toFixed(2)} · ${esc(o.date)}</p>`).join(""):'<div class="empty">Your purchases will appear here.</div>'}</section></div><section class="panel" style="margin-top:16px"><div class="eyebrow">Custom orders</div><h2 style="font-weight:normal">My custom bag requests</h2>${customRequests.filter(r=>r.owner===user.email).length?customRequests.filter(r=>r.owner===user.email).map(r=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><b>${esc(r.style)}</b><p class="muted">${esc(r.status)}${r.estimate?" · Estimated: "+esc(r.estimate):""}${r.price!=null?" · Quote: $"+Number(r.price).toFixed(2):""}</p>${r.status==="Quote ready"?`<button class="btn primary small" onclick="payCustomQuote(${r.id})">Accept quote & continue to payment</button>`:""}</div>`).join(""):'<div class="empty">You have not submitted a custom bag request yet.</div>'}</section><div class="actions"><button class="btn" onclick="logout()">Sign out</button></div>`:`<h1 class="page-title">Your account</h1><div class="panel" style="max-width:520px"><p class="muted">Sign in to see your account, saved designs, and order history, or create a customer account when registration is open.</p><div class="actions"><button class="btn primary" onclick="login()">Sign in</button><button class="btn" onclick="register()">Create account</button></div></div>`}
}
function filterProducts(q){document.getElementById("productGrid").innerHTML=bags.filter(b=>b.name.toLowerCase().includes(q.toLowerCase())||b.desc.toLowerCase().includes(q.toLowerCase())).map(card).join("")||'<div class="empty">No matching bags.</div>'}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render()}
function drawer(title,body){document.getElementById("drawerTitle").textContent=title;document.getElementById("drawerBody").innerHTML=body;document.getElementById("overlay").classList.remove("hidden")}
function closeDrawer(){document.getElementById("overlay").classList.add("hidden")}
document.getElementById("favOpen").onclick=()=>drawer("Your favorites",favorites.length?bags.filter(b=>favorites.includes(b.id)).map(card).join(""):'<div class="empty">Save a bag with the ♡ button and it will appear here.</div>');
document.getElementById("drawerClose").onclick=closeDrawer;document.getElementById("shade").onclick=closeDrawer;
function orderInquiry(id){const b=bags.find(x=>x.id===id);if(!b||b.stock<1)return;drawer("Send an order inquiry",`<p class="muted">You're asking about <b>${esc(b.name)}</b> · $${Number(b.price).toFixed(2)}</p><div class="field"><label>Your name</label><input id="oiName" value="${esc(user?.first||"")} ${esc(user?.last||"")}" placeholder="First and last name"></div><div class="field"><label>Email address</label><input id="oiEmail" type="email" value="${esc(user?.email||"")}" placeholder="you@example.com"></div><div class="field"><label>Color preference</label><select id="oiColor">${b.colors.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div class="field"><label>Quantity requested</label><input id="oiQty" type="number" min="1" max="${b.stock}" value="1"></div><div class="field"><label>Message (optional)</label><textarea id="oiMessage" placeholder="Any questions or details?"></textarea></div><div class="notice">This is an inquiry, not a purchase. No payment is taken and your item is not reserved until the maker confirms availability.</div><button class="btn primary" onclick="submitOrderInquiry(${b.id})">Send inquiry</button>`)}
function submitOrderInquiry(id){const b=bags.find(x=>x.id===id);const name=document.getElementById("oiName").value.trim(),email=document.getElementById("oiEmail").value.trim(),qty=Number(document.getElementById("oiQty").value);if(!name||!email||!email.includes("@")||qty<1||qty>b.stock){alert("Please enter your name, a valid email, and a quantity within the available stock.");return}orderInquiries.unshift({id:Date.now(),productId:id,product:b.name,price:b.price,name,email,color:document.getElementById("oiColor").value,qty,message:document.getElementById("oiMessage").value,status:"New",date:new Date().toLocaleString()});save();closeDrawer();alert("Your inquiry has been saved in this prototype. In the live website, it will be sent securely to the shop owner.");}
function login(){drawer("Sign in",`<div class="field"><label>Email</label><input id="loginEmail" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="loginPass" type="password"></div><button class="btn primary" onclick="doLogin()">Sign in</button><p class="muted">Prototype note: sign-in is simulated on this device only.</p><button class="btn" onclick="register()">Create account</button><hr><button class="btn" onclick="adminLogin()">Administrator demo</button>`)}
function doLogin(){let email=document.getElementById("loginEmail").value; if(!email){alert("Enter an email address.");return}user={first:"Customer",last:"",email,address:""};customers.push({first:user.first,last:user.last,email:user.email,address:user.address});save();closeDrawer();go("account")}
function register(){drawer("Create an account",registrationOpen?`<div class="field"><label>First name</label><input id="rFirst"></div><div class="field"><label>Last name</label><input id="rLast"></div><div class="field"><label>Email</label><input id="rEmail" type="email"></div><div class="field"><label>Password</label><input id="rPass" type="password"></div><div class="field"><label>Mailing address</label><textarea id="rAddress"></textarea></div><div class="notice">For real checkout, payment information is entered securely with the payment provider, not stored on this site.</div><button class="btn primary" onclick="doRegister()">Create account</button>`:`<div class="empty">Customer registration is currently closed. Please check back when the shop opens.</div>`)}
function doRegister(){user={first:document.getElementById("rFirst").value,last:document.getElementById("rLast").value,email:document.getElementById("rEmail").value,address:document.getElementById("rAddress").value};if(!user.first||!user.email){alert("Please add your first name and email.");return}customers.push({first:user.first,last:user.last,email:user.email,address:user.address});save();closeDrawer();go("account")}
function adminLogin(){drawer("Administrator access",`<p class="muted">Demo administrator mode. This is not secure authentication and must be replaced before publishing.</p><div class="field"><label>Demo passphrase</label><input id="adminPass" type="password" placeholder="Enter demo"></div><button class="btn primary" onclick="if(document.getElementById('adminPass').value==='birkie-demo'){isAdmin=true;closeDrawer();go('admin')}else alert('For this prototype, use birkie-demo')">Enter admin preview</button>`)}
function logout(){user=null;save();go("home")}
function editProfile(){let first=prompt("First name",user.first);if(first!==null){user.first=first;save();render()}}
function editBag(id){let b=id?bags.find(x=>x.id===id):{id:Date.now(),name:"",price:0,stock:0,desc:"",colors:["Cream"],emoji:"👜",tone:""};drawer(id?"Edit product":"Add a product",`<div class="field"><label>Bag name</label><input id="eName" value="${esc(b.name)}"></div><div class="field"><label>Price ($)</label><input id="ePrice" type="number" min="0" value="${b.price}"></div><div class="field"><label>Quantity in stock</label><input id="eStock" type="number" min="0" value="${b.stock}"></div><div class="field"><label>Short description</label><textarea id="eDesc">${esc(b.desc)}</textarea></div><div class="field"><label>Product photo</label><input id="eImage" type="file" accept="image/*" onchange="loadProductImage(this.files[0])"><span class="muted">Choose a photo from your device. Stored only in this browser prototype.</span></div><div class="field"><label>Colors (comma-separated)</label><input id="eColors" value="${esc(b.colors.join(", "))}"></div><button class="btn primary" onclick="saveBag(${b.id})">Save product</button>${id?`<button class="btn" onclick="deleteBag(${b.id})">Delete product</button>`:""}`)}
let pendingProductImage=null;function loadProductImage(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{pendingProductImage=reader.result};reader.readAsDataURL(file)}
function saveBag(id){let b=bags.find(x=>x.id===id);if(!b){b={id,emoji:"👜",tone:""};bags.push(b)}b.name=document.getElementById("eName").value;b.price=Number(document.getElementById("ePrice").value);b.stock=Number(document.getElementById("eStock").value);b.desc=document.getElementById("eDesc").value;b.colors=document.getElementById("eColors").value.split(",").map(x=>x.trim()).filter(Boolean);if(pendingProductImage)b.image=pendingProductImage;pendingProductImage=null;save();closeDrawer();render()}
function deleteBag(id){if(confirm("Remove this product from the demo catalog?")){bags=bags.filter(b=>b.id!==id);save();closeDrawer();render()}}
function setMode(m){designerMode=m;document.getElementById("modeStyle").classList.toggle("selected",m==="style");document.getElementById("modeBlank").classList.toggle("selected",m==="blank");document.getElementById("stylePick").disabled=m==="blank";if(m==="blank")document.getElementById("stylePick").value="Build-your-own shape"}
function updatePreview(){document.getElementById("preview").textContent=selectedColor==="Lilac"?"👛":"👜"}
function saveDesign(){storeDesign(false)}
function postDesign(){storeDesign(true)}
function storeDesign(pub){let d={id:Date.now(),owner:user?.email||"Guest",style:document.getElementById("stylePick").value,color:document.getElementById("colorPick").value,handle:document.getElementById("handlePick").value,notes:document.getElementById("designNotes").value,public:pub};designs.unshift(d);save();render();alert(pub?"Your design has been added to the community gallery.":"Your design has been saved to your design book.")}
function designList(list){return list.length?list.map(d=>`<div style="border-bottom:1px solid var(--line);padding:12px 0"><b>${esc(d.style)}</b><div class="muted">${esc(d.color)} · ${esc(d.handle)}</div><div class="muted">${esc(d.notes)}</div>${d.public?'<span class="tag">Shared publicly</span>':""}</div>`).join(""):'<div class="empty">No designs yet. Make something lovely!</div>'}

function saveAbout(){about={title:document.getElementById("aboutTitle").value.trim()||"About the maker",body:document.getElementById("aboutBody").value.trim(),maker:document.getElementById("aboutMaker").value.trim()};save();window.adminSubpage=null;go("admin");alert("Your About Me section has been saved in this browser prototype.")}
function toggleRegistration(){registrationOpen=!registrationOpen;save();render()}
function adminSection(which){window.adminSubpage=which;renderAdminSubpage()}
function renderAdminSubpage(){
const sub=window.adminSubpage;
if(sub==="about"){app.innerHTML=`<button class="btn" onclick="window.adminSubpage=null;go('admin')">← Dashboard</button><h1 class="page-title">Edit your About Me section</h1><p class="page-intro">These details appear on the public home page. Share only information you are comfortable making public.</p><section class="panel" style="max-width:700px"><div class="field"><label>Section heading</label><input id="aboutTitle" value="${esc(about.title)}"></div><div class="field"><label>Your introduction</label><textarea id="aboutBody" style="min-height:160px">${esc(about.body)}</textarea></div><div class="field"><label>Sign-off (optional)</label><input id="aboutMaker" value="${esc(about.maker)}"></div><div class="actions"><button class="btn primary" onclick="saveAbout()">Save About Me</button><button class="btn" onclick="window.adminSubpage=null;go('home')">Preview home page</button></div></section>`;return}
if(sub==="products"){app.innerHTML=`<button class="btn" onclick="window.adminSubpage=null;go('admin')">← Dashboard</button><h1 class="page-title">Products & inventory</h1><button class="btn primary" onclick="editBag()">＋ Add product</button><div class="grid" style="margin-top:18px">${bags.map(card).join("")}</div>`;return}
if(sub==="inquiries"){app.innerHTML=`<button class="btn" onclick="window.adminSubpage=null;go('admin')">← Dashboard</button><h1 class="page-title">Product order inquiries</h1><p class="page-intro">Customers are asking about products. Reply using the email address they provided; no payment has been collected.</p>${orderInquiries.length?orderInquiries.map(q=>`<section class="panel" style="margin:12px 0"><div class="tag">${esc(q.status)}</div><h2 style="font-weight:normal">${esc(q.product)} · ${esc(q.color)}</h2><p class="muted">${esc(q.name)} · ${esc(q.email)}<br>Quantity: ${q.qty} · Listed price: $${Number(q.price).toFixed(2)} each<br>${esc(q.date)}<br>${esc(q.message||"No additional message")}</p><div class="actions"><button class="btn" onclick="markInquiry(${q.id})">Mark contacted</button><a class="btn" href="mailto:${encodeURIComponent(q.email)}?subject=${encodeURIComponent("BirkieBags order inquiry: "+q.product)}">Email customer</a></div></section>`).join(""):'<div class="empty">No product inquiries yet.</div>'}`;return}
if(sub==="requests"){app.innerHTML=`<button class="btn" onclick="window.adminSubpage=null;go('admin')">← Dashboard</button><h1 class="page-title">Custom bag requests</h1><p class="page-intro">Review each design, decide whether you can make it, and set a price before sending the customer to secure checkout.</p>${customRequests.length?customRequests.map(r=>`<section class="panel" style="margin:12px 0"><div class="tag">${esc(r.status)}</div><h2 style="font-weight:normal">${esc(r.style)} · ${esc(r.color)}</h2><p class="muted">Customer: ${esc(r.owner)} · ${esc(r.handle)}<br>Details: ${esc(r.notes||"No extra details")}</p><div class="two"><div class="field"><label>Your price ($)</label><input type="number" min="0" step=".01" id="quote-${r.id}" value="${r.price??""}" placeholder="Set final price"></div><div class="field"><label>Estimated production time</label><input id="time-${r.id}" value="${esc(r.estimate||"")}" placeholder="e.g. 2–3 weeks"></div></div><div class="actions"><button class="btn primary" onclick="approveRequest(${r.id})">Approve & send quote</button><button class="btn" onclick="declineRequest(${r.id})">Decline</button></div></section>`).join(""):'<div class="empty">No custom requests yet. Customer submissions will appear here.</div>'}`;return}
if(sub==="gallery"){app.innerHTML=`<button class="btn" onclick="window.adminSubpage=null;go('admin')">← Dashboard</button><h1 class="page-title">Community gallery moderation</h1>${designs.filter(d=>d.public).length?designs.filter(d=>d.public).map(d=>`<section class="panel" style="margin:12px 0"><b>${esc(d.style)}</b><p class="muted">${esc(d.color)} · ${esc(d.handle)} · ${esc(d.owner)}<br>${esc(d.notes)}</p><button class="btn" onclick="removePublicDesign(${d.id})">Remove from public gallery</button></section>`).join(""):'<div class="empty">No public designs to review.</div>'}`;return}
if(sub==="orders"){app.innerHTML=`<button class="btn" onclick="window.adminSubpage=null;go('admin')">← Dashboard</button><h1 class="page-title">Orders</h1>${orders.length?orders.map((o,i)=>`<section class="panel" style="margin:10px 0"><b>${esc(o.name)}</b><p class="muted">$${Number(o.price).toFixed(2)} · ${esc(o.date)} · ${esc(o.status||"Demo order")}</p></section>`).join(""):'<div class="empty">No demo orders yet.</div>'}`;return}
if(sub==="customers"){app.innerHTML=`<button class="btn" onclick="window.adminSubpage=null;go('admin')">← Dashboard</button><h1 class="page-title">Customer accounts</h1>${customers.length?customers.map(c=>`<section class="panel" style="margin:10px 0"><b>${esc(c.first)} ${esc(c.last)}</b><p class="muted">${esc(c.email)}<br>${esc(c.address)}</p></section>`).join(""):'<div class="empty">No customer accounts registered in this browser yet.</div>'}`;return}
}
function submitCustomRequest(){
const d={id:Date.now(),owner:user?.email||"Guest",style:document.getElementById("stylePick").value,color:document.getElementById("colorPick").value,handle:document.getElementById("handlePick").value,notes:document.getElementById("designNotes").value};
if(!user){alert("Create an account or sign in before submitting a custom request.");login();return}
customRequests.unshift({...d,status:"Pending",price:null,estimate:""});
designs.unshift({...d,public:false});save();alert("Your design was submitted! The maker will review it and send a price for approval.");render();
}
function markInquiry(id){const q=orderInquiries.find(x=>x.id===id);if(q){q.status="Contacted";save();renderAdminSubpage()}}
function approveRequest(id){const r=customRequests.find(x=>x.id===id);const price=Number(document.getElementById("quote-"+id).value);if(!price||price<=0){alert("Enter a price greater than zero.");return}r.price=price;r.estimate=document.getElementById("time-"+id).value;r.status="Quote ready";save();alert("Quote saved in this prototype. In the live store, the customer would receive a notification and secure payment link.");renderAdminSubpage()}
function payCustomQuote(id){const r=customRequests.find(x=>x.id===id);if(!r||r.status!=="Quote ready")return;alert("Demo payment only: no money has been collected. Live checkout will use the approved quote amount.");r.status="Customer accepted quote (demo)";orders.unshift({name:"Custom: "+r.style,price:r.price,date:new Date().toLocaleDateString(),status:"Awaiting live payment integration"});save();render()}
function declineRequest(id){const r=customRequests.find(x=>x.id===id);r.status="Declined";save();renderAdminSubpage()}
function removePublicDesign(id){designs=designs.map(d=>d.id===id?{...d,public:false}:d);save();renderAdminSubpage()}

document.getElementById("adminExit").onclick=()=>{isAdmin=false;window.adminSubpage=null;go("home")};
document.getElementById("loginOpen").onclick=login;
render();
</script></body></html>
